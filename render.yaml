services:
  - type: web
    name: share-window-signaling
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CLIENT_ORIGIN
        sync: false

  - type: web
    name: kabin-finanzas-api
    runtime: node
    rootDir: server-finanzas
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: kabin-finanzas-db
          property: connectionString

databases:
  - name: kabin-finanzas-db
    databaseName: kabin
    user: kabin
    plan: free
